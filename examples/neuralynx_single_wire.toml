[input]
format = "neuralynx"
path = "/data/subject/session/micros"
# stream_id = "0"               # required when the extractor has multiple streams

[probe]
preset = "bf_single8"           # 8 single-contact probes per bundle

[sorting]
backend = "mountainsort5"
profile = "bf_single_wire"
seed = 0

[curation]
policy = "single_wire_merge_preserve_events"

[output]
root = "/data/subject/sorting_runs"
